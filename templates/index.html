<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NetRunner Terminal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Сброс стилей */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
            -webkit-tap-highlight-color: transparent; /* Убирает синюю рамку при клике на телефоне */
        }

        body {
            background-color: #0a0a0a;
            color: #00ff41;
            min-height: 100vh;
            display: flex;
            justify-content: center; /* Центрируем контент по горизонтали */
            padding: 15px;
            padding-bottom: 80px;
            overflow-x: hidden;
        }

        /* Контейнер, имитирующий мобильный экран, даже если открыт на ПК */
        .app-container {
            width: 100%;
            max-width: 380px; /* Ширина под телефон */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Шапка --- */
        .header {
            width: 100%;
            text-align: center;
            margin-bottom: 25px;
            margin-top: 10px;
        }

        .title {
            font-size: 12px;
            color: #888;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .balance {
            font-size: 46px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff41, 0 0 20px #00ff41;
            margin-bottom: 5px;
            line-height: 1;
        }

        .income {
            font-size: 15px;
            color: #b026ff;
            text-shadow: 0 0 5px #b026ff;
            font-weight: bold;
        }

        /* --- Кнопка "Забрать" --- */
        .main-btn {
            width: 100%;
            padding: 18px;
            background: transparent;
            border: 2px solid #00ff41;
            color: #00ff41;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.4), inset 0 0 15px rgba(0, 255, 65, 0.2);
            transition: all 0.1s;
            margin-bottom: 30px;
        }

        .main-btn:active {
            background: #00ff41;
            color: #0a0a0a;
            box-shadow: 0 0 30px #00ff41;
        }

        /* --- Секция инвентаря --- */
        .inventory-section {
            width: 100%;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .section-title {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Кнопки сортировки */
        .sort-controls {
            display: flex;
            gap: 6px;
        }

        .sort-btn {
            background: #111;
            border: 1px solid #333;
            color: #888;
            font-size: 10px;
            padding: 6px 8px;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .sort-btn.active {
            border-color: #00ff41;
            color: #00ff41;
            box-shadow: 0 0 5px #00ff41;
        }

        /* Сетка карточек */
        .inventory-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Строго 2 колонки */
            gap: 10px;
            width: 100%;
        }

        .item-card {
            background: #111;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 85px;
            cursor: pointer;
        }

        .item-card:active {
            filter: brightness(1.5);
        }

        /* Рамки редкостей */
        .item-card.common { border-color: #555; }
        .item-card.rare { border-color: #00bfff; box-shadow: inset 0 0 10px rgba(0, 191, 255, 0.1); }
        .item-card.epic { border-color: #b026ff; box-shadow: inset 0 0 10px rgba(176, 38, 255, 0.1); }
        .item-card.legendary { border-color: #ffd700; box-shadow: inset 0 0 15px rgba(255, 215, 0, 0.15); }

        .item-type {
            font-size: 9px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .item-name {
            font-size: 12px;
            color: #fff;
            font-weight: bold;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .item-income {
            font-size: 12px;
            color: #00ff41;
            font-weight: bold;
        }

        /* --- Всплывающие уведомления (Тосты) --- */
        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
            width: 90%;
            max-width: 350px;
            pointer-events: none;
        }

        .toast {
            background: #111;
            border: 2px solid #00ff41;
            color: #00ff41;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.3);
            animation: slideUp 0.3s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .toast.rare { border-color: #00bfff; color: #00bfff; }
        .toast.epic { border-color: #b026ff; color: #b026ff; }
        .toast.legendary { border-color: #ffd700; color: #ffd700; }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }
        
        .toast.hiding {
            animation: fadeOut 0.3s ease-in forwards;
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(10px); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Шапка -->
        <div class="header">
            <div class="title">NETRUNNER TERMINAL</div>
            <div class="balance" id="balanceDisplay">1 500 ₽</div>
            <div class="income" id="incomeDisplay">+ 150 ₽/ч</div>
        </div>

        <!-- Главная кнопка -->
        <button class="main-btn" id="claimBtn">Взломать и забрать</button>

        <!-- Инвентарь -->
        <div class="inventory-section">
            <div class="section-header">
                <div class="section-title">АРСЕНАЛ</div>
                <div class="sort-controls">
                    <button class="sort-btn active" id="btnRarity">Редкость</button>
                    <button class="sort-btn" id="btnIncome">Прибыль</button>
                </div>
            </div>
            <div class="inventory-grid" id="inventoryGrid"></div>
        </div>
    </div>

    <!-- Контейнер для уведомлений -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // --- ДАННЫЕ ---
        let balance = 1500;
        
        // Временный инвентарь для проверки отображения
        let inventory = [
            { id: 1, name: "Скрипт 'Червь'", type: "Скрипт", rarity: "common", income: 50 },
            { id: 2, name: "Бот-парсер", type: "Бот", rarity: "rare", income: 150 },
            { id: 3, name: "Нейросеть 'Оракул'", type: "Бот", rarity: "epic", income: 500 },
            { id: 4, name: "Абсолютный Бэкдор", type: "Бэкдор", rarity: "legendary", income: 2000 },
            { id: 5, name: "Троян-невидимка", type: "Троян", rarity: "common", income: 70 }
        ];

        let currentSort = 'rarity'; 
        const rarityWeight = { "legendary": 4, "epic": 3, "rare": 2, "common": 1 };

        // --- УВЕДОМЛЕНИЯ ---
        function showToast(message, rarity = 'common') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${rarity}`;
            toast.innerText = message;
            
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('hiding');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // --- ОБНОВЛЕНИЕ ЭКРАНА ---
        function updateUI() {
            let totalIncome = inventory.reduce((sum, item) => sum + item.income, 0);
            
            document.getElementById('balanceDisplay').innerText = balance.toLocaleString('ru-RU') + ' ₽';
            document.getElementById('incomeDisplay').innerText = '+ ' + totalIncome.toLocaleString('ru-RU') + ' ₽/ч';

            const grid = document.getElementById('inventoryGrid');
            grid.innerHTML = ''; 

            let sortedInv = [...inventory].sort((a, b) => {
                if (currentSort === 'rarity') {
                    if (rarityWeight[b.rarity] !== rarityWeight[a.rarity]) {
                        return rarityWeight[b.rarity] - rarityWeight[a.rarity];
                    }
                    return b.income - a.income;
                } else {
                    return b.income - a.income;
                }
            });

            sortedInv.forEach(item => {
                const card = document.createElement('div');
                card.className = `item-card ${item.rarity}`;
                card.innerHTML = `
                    <div>
                        <div class="item-type">${item.type}</div>
                        <div class="item-name">${item.name}</div>
                    </div>
                    <div class="item-income">+ ${item.income} ₽/ч</div>
                `;
                
                // Клик по карточке для показа деталей
                card.addEventListener('click', () => {
                    const rarityRu = { common: "Обычный", rare: "Редкий", epic: "Эпический", legendary: "Легендарный" };
                    showToast(`${item.name} | ${rarityRu[item.rarity]}`, item.rarity);
                });

                grid.appendChild(card);
            });
        }

        // --- СОРТИРОВКА ---
        document.getElementById('btnRarity').addEventListener('click', function() {
            currentSort = 'rarity';
            this.classList.add('active');
            document.getElementById('btnIncome').classList.remove('active');
            updateUI();
        });

        document.getElementById('btnIncome').addEventListener('click', function() {
            currentSort = 'income';
            this.classList.add('active');
            document.getElementById('btnRarity').classList.remove('active');
            updateUI();
        });

        // --- КЛИК ПО КНОПКЕ "ЗАБРАТЬ" ---
        document.getElementById('claimBtn').addEventListener('click', () => {
            // Пока для теста - рандомный доход
            const earned = Math.floor(Math.random() * 400) + 100; 
            balance += earned;
            updateUI();
            showToast(`💸 Взлом успешен! + ${earned} ₽`);
        });

        // Запуск игры при загрузке
        updateUI();

    </script>
</body>
</html>
