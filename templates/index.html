<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кот-Барон</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { background: radial-gradient(circle at top, #2a1b15, #0a0a0a); color: #fff; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; padding: 15px; }
        
        .header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 16px; border: 1px solid #331c0f; margin-bottom: 20px;}
        .stat-box { text-align: center; }
        .stat-title { font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        .stat-value { font-size: 20px; font-weight: bold; color: #ffaa00; text-shadow: 0 0 10px rgba(255, 170, 0, 0.5); }
        
        .energy-container { width: 100%; max-width: 400px; margin-bottom: 20px; }
        .energy-bar { width: 100%; height: 16px; background: #222; border-radius: 8px; overflow: hidden; border: 1px solid #444; }
        .energy-fill { height: 100%; background: linear-gradient(90deg, #00ff41, #b026ff); width: 100%; transition: width 0.3s; }
        .energy-text { text-align: center; font-size: 12px; color: #aaa; margin-top: 5px; }

        .cat-container { flex: 1; display: flex; justify-content: center; align-items: center; width: 100%; }
        .cat-btn { background: none; border: none; font-size: 140px; cursor: pointer; transition: transform 0.05s; filter: drop-shadow(0 0 20px rgba(255, 170, 0, 0.3)); }
        .cat-btn:active { transform: scale(0.9); }
        .cat-btn.off { filter: grayscale(100%) brightness(0.5); cursor: not-allowed; }

        .shop { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .shop-btn { background: rgba(255, 170, 0, 0.1); border: 1px solid #ffaa00; color: #fff; padding: 15px; border-radius: 12px; font-size: 14px; display: flex; justify-content: space-between; cursor: pointer; transition: 0.2s; }
        .shop-btn:active { background: rgba(255, 170, 0, 0.3); }
        .shop-btn.disabled { border-color: #555; color: #555; background: rgba(0,0,0,0.5); }
        .shop-price { color: #ffaa00; font-weight: bold; }
        
        .buy-energy { background: linear-gradient(145deg, #0088cc, #005580); border: none; color: white; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .buy-energy:active { transform: scale(0.96); }
    </style>
</head>
<body>
    <div class="header">
        <div class="stat-box">
            <div class="stat-title">Баланс</div>
            <div class="stat-value" id="coins">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-title">Тап дает</div>
            <div class="stat-value" id="tapPower">1</div>
        </div>
    </div>

    <div class="energy-container">
        <div class="energy-bar"><div class="energy-fill" id="energyBar"></div></div>
        <div class="energy-text"><span id="energyText">1000 / 1000</span></div>
    </div>

    <div class="cat-container">
        <button class="cat-btn" id="tapBtn">🐱</button>
    </div>

    <div class="shop">
        <button class="shop-btn" id="buyPowerBtn" onclick="upgradeTap()">
            <span>🦾 Усилить когти (Ур. <span id="tapLvl">1</span>)</span>
            <span class="shop-price" id="tapCost">500</span>
        </button>
        <button class="shop-btn" id="buyCatBtn" onclick="buyCat()">
            <span>🐈 Нанять кота (Доход +10/ч)</span>
            <span class="shop-price" id="catCost">2000</span>
        </button>
        <button class="buy-energy" id="buyEnergyBtn" onclick="buyEnergy()">
            ⚡ Восстановить энергию (5 ⭐️)
        </button>
    </div>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
        const userId = Telegram.WebApp.initDataUnsafe.user.id;

        let game = { coins: 0, tap_power: 1, energy: 1000, max_energy: 1000, tap_level: 1, tap_cost: 500, cat_cost: 2000, income: 0 };

        function loadData() {
            fetch('/api/get_state', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ user_id: userId }) })
            .then(res => res.json()).then(data => {
                game = data;
                updateUI();
            });
        }

        function updateUI() {
            document.getElementById('coins').innerText = Math.floor(game.coins).toLocaleString('ru-RU');
            document.getElementById('tapPower').innerText = game.tap_power;
            document.getElementById('tapLvl').innerText = game.tap_level;
            document.getElementById('tapCost').innerText = game.tap_cost;
            document.getElementById('catCost').innerText = game.cat_cost;
            
            document.getElementById('energyText').innerText = `${Math.floor(game.energy)} / ${game.max_energy}`;
            let energyPercent = (game.energy / game.max_energy) * 100;
            document.getElementById('energyBar').style.width = energyPercent + "%";

            const btn = document.getElementById('tapBtn');
            if (game.energy < 1) { btn.classList.add('off'); } else { btn.classList.remove('off'); }
        }

        document.getElementById('tapBtn').addEventListener('click', () => {
            if (game.energy >= 1) {
                game.energy -= 1;
                game.coins += game.tap_power;
                Telegram.WebApp.HapticFeedback.impactOccurred('light');
                updateUI();
                fetch('/api/tap', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ user_id: userId }) });
            } else {
                Telegram.WebApp.HapticFeedback.notificationOccurred('error');
            }
        });

        function upgradeTap() {
            if (game.coins >= game.tap_cost) {
                fetch('/api/upgrade_tap', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ user_id: userId }) })
                .then(res => res.json()).then(data => {
                    if (data.success) { Telegram.WebApp.HapticFeedback.notificationOccurred('success'); loadData(); }
                    else { Telegram.WebApp.showAlert(data.message); }
                });
            }
        }

        function buyCat() {
            if (game.coins >= game.cat_cost) {
                fetch('/api/buy_cat', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ user_id: userId }) })
                .then(res => res.json()).then(data => {
                    if (data.success) { Telegram.WebApp.HapticFeedback.notificationOccurred('success'); loadData(); }
                    else { Telegram.WebApp.showAlert(data.message); }
                });
            }
        }

        function buyEnergy() {
            fetch('/api/buy_energy', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ user_id: userId }) })
            .then(res => res.json()).then(data => {
                if (data.success) { 
                    Telegram.WebApp.showAlert("Счет выставлен! Проверьте чат с ботом."); 
                    Telegram.WebApp.close(); 
                } 
            });
        }

        setInterval(loadData, 10000);
        loadData();
    </script>
</body>
</html>
