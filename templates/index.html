<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NetRunner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #0a0a0a; color: #00ff41; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        
        .tab-content { display: none; width: 100%; max-width: 400px; flex-direction: column; align-items: center; }
        .tab-content.active { display: flex; }

        .balance-card { background: linear-gradient(180deg, #111 0%, #0a0a0a 100%); border: 1px solid #00ff41; border-radius: 12px; padding: 20px; width: 100%; text-align: center; box-shadow: 0 0 20px rgba(0, 255, 65, 0.2); margin-bottom: 20px; margin-top: 10px; }
        .balance-amount { font-size: 48px; font-weight: bold; text-shadow: 0 0 15px #00ff41; }
        .income-text { color: #b026ff; font-size: 14px; margin-top: 5px; text-shadow: 0 0 5px #b026ff; font-weight: bold; }
        
        .btn { width: 100%; padding: 16px; background: transparent; border: 2px solid #00ff41; color: #00ff41; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 0 10px #00ff41; text-transform: uppercase; margin-bottom: 12px; transition: 0.1s; position: relative; overflow: hidden;}
        .btn:active { background: #00ff41; color: #0a0a0a; transform: scale(0.98); }
        
        .btn-case { border-color: #b026ff; color: #b026ff; box-shadow: 0 0 10px #b026ff; }
        .btn-case:active { background: #b026ff; color: #0a0a0a; }
        
        .btn-upgrade { border-color: #00bfff; color: #00bfff; box-shadow: 0 0 10px #00bfff; }
        .btn-upgrade:active { background: #00bfff; color: #0a0a0a; }
        
        .btn-luck { border-color: #ff8c00; color: #ff8c00; box-shadow: 0 0 10px #ff8c00; }
        .btn-luck:active { background: #ff8c00; color: #0a0a0a; }
        
        .btn-premium { border-color: #ffd700; color: #ffd700; box-shadow: 0 0 10px #ffd700; }
        .btn-premium:active { background: #ffd700; color: #0a0a0a; }

        .btn-daily { border-color: #00ff00; color: #00ff00; box-shadow: 0 0 10px #00ff00; }
        .btn-daily:active { background: #00ff00; color: #0a0a0a; }

        .inventory-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; margin-top: 10px; padding-bottom: 80px; }
        .item-card { background: #111; border: 1px solid #333; padding: 12px; border-radius: 10px; text-align: center; cursor: pointer; transition: 0.2s; position: relative; }
        .item-card:active { transform: scale(0.95); }
        .item-icon { font-size: 32px; margin-bottom: 5px; filter: drop-shadow(0 0 5px currentColor); }
        .item-type { font-size: 10px; color: #888; text-transform: uppercase; margin-bottom: 3px; }
        .item-name { font-size: 11px; color: #fff; margin-bottom: 5px; font-weight: bold; line-height: 1.2; }
        .item-income { font-size: 12px; color: #00ff41; font-weight: bold; }
        
        .rarity-Обычный { border-color: #888; box-shadow: 0 0 5px #888; color: #888; }
        .rarity-Редкий { border-color: #00bfff; box-shadow: 0 0 8px #00bfff; color: #00bfff;}
        .rarity-Эпический { border-color: #b026ff; box-shadow: 0 0 12px #b026ff; color: #b026ff;}
        .rarity-Легендарный { border-color: #ffd700; box-shadow: 0 0 15px #ffd700; color: #ffd700;}
        .rarity-Мифический { border-color: #ff0000; box-shadow: 0 0 20px #ff0000; color: #ff0000;}

        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #111; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #333; z-index: 100; }
        .nav-btn { background: none; border: none; color: #888; font-size: 24px; cursor: pointer; transition: 0.2s; }
        .nav-btn.active { color: #00ff41; text-shadow: 0 0 10px #00ff41; transform: scale(1.2); }
        
        .craft-box { background: #111; border: 1px solid #333; padding: 15px; border-radius: 10px; width: 100%; margin-bottom: 15px; box-shadow: 0 0 10px rgba(255,0,255,0.1); }
        .craft-title { color: #fff; margin-bottom: 10px; font-size: 13px; text-align: center; }
        .btn-craft { border-color: #ff00ff; color: #ff00ff; box-shadow: 0 0 10px #ff00ff; font-size: 14px; padding: 10px; margin-bottom: 0;}
        .btn-craft:active { background: #ff00ff; color: #0a0a0a; }
    </style>
</head>
<body>
    <div id="tab-main" class="tab-content active">
        <div class="balance-card">
            <div>БАЛАНС</div>
            <div class="balance-amount" id="balance">0 ₽</div>
            <div class="income-text" id="income">Доход: 0 ₽/ч</div>
        </div>
        
        <button class="btn" id="claimBtn">Взломать и забрать</button>
        <button class="btn btn-daily" id="dailyBtn">Ежедневный бонус</button>
        <button class="btn btn-upgrade" id="upgrade
