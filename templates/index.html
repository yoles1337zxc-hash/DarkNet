<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetRunner Terminal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #0a0a0a;
            color: #00ff41;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            padding-bottom: 80px; /* Место для тостов */
        }

        /* --- Шапка --- */
        .header {
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 12px;
            color: #888;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .balance {
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff41, 0 0 20px #00ff41;
            margin-bottom: 5px;
        }

        .income {
            font-size: 16px;
            color: #b026ff;
            text-shadow: 0 0 5px #b026ff;
        }

        /* --- Кнопка "Забрать" --- */
        .main-btn {
            width: 100%;
            max-width: 350px;
            padding: 15px;
            background: transparent;
            border: 2px solid #00ff41;
            color: #00ff41;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 10px #00ff41, inset 0 0 10px #00ff41;
            transition: all 0.2s;
            margin-bottom: 30px;
        }

        .main-btn:active {
            background: #00ff41;
            color: #0a0a0a;
            box-shadow: 0 0 30px #00ff41;
        }

        /* --- Секция инвентаря --- */
        .inventory-section {
            width: 100%;
            max-width: 350px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .section-title {
            font-size: 16px;
            color: #888;
            text-transform: uppercase;
        }

        /* Кнопки сортировки */
        .sort-controls {
            display: flex;
            gap: 5px;
        }

        .sort-btn {
            background: #111;
            border: 1px solid #333;
            color: #888;
            font-size: 10px;
            padding: 5px 8px;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
            transition: 0.2s;
        }

        .sort-btn:hover, .sort-btn.active {
            border-color: #00ff41;
            color: #00ff41;
            box-shadow: 0 0 5px #00ff41;
        }

        /* --- Сетка предметов --- */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .item-card {
            background: #111;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 6px;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        /* Редкости (рамки) */
        .item-card.common { border-color: #555; }
        .item-card.rare { border-color: #00bfff; box-shadow: inset 0 0 10px rgba(0, 191, 255, 0.2); }
        .item-card.epic { border-color: #b026ff; box-shadow: inset 0 0 10px rgba(176, 38, 255, 0.2); }
        .item-card.legendary { border-color: #ffd700; box-shadow: inset 0 0 15px rgba(255, 215, 0, 0.3); }

        .item-type {
            font-size: 9px;
            color: #555;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .item-name {
            font-size: 12px;
            margin-bottom: 8px;
            color: #fff;
            font-weight: bold;
        }

        .item-income {
            font-size: 11px;
            color: #00ff41;
            font-weight: bold;
        }

        /* --- Всплывающие уведомления (Тосты) --- */
        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
            width: 90%;
            max-width: 350px;
        }

        .toast {
            background: #111;
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.5);
            animation: slideUp 0.3s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        /* Цвета для разных уведомлений */
        .toast.error { border-color: #ff3333; color: #ff3333; box-shadow: 0 0 15px rgba(255, 51, 51, 0.5); }
        .toast.epic { border-color: #b026ff; color: #b026ff; box-shadow: 0 0 15px rgba(176, 38, 255, 0.5); }
        .toast.gold { border-color: #ffd700; color: #ffd700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.5); }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }
        
        .toast.hiding {
            animation: fadeOut 0.3s ease-in forwards;
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(10px); }
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="header">
        <div class="title">NETRUNNER TERMINAL</div>
        <div class="balance" id="balanceDisplay">1 500 ₽</div>
        <div class="income">+ 150 ₽/ч</div>
    </div>

    <!-- Главная кнопка -->
    <button class="main-btn" id="claimBtn">Взломать и забрать</button>

    <!-- Инвентарь -->
    <div class="inventory-section">
        <div class="section-header">
            <div class="section-title">АРСЕНАЛ</div>
            <div class="sort-controls">
                <button class="sort-btn active" onclick="sortInventory('rarity', this)">По редкости</button>
                <button class="sort-btn" onclick="sortInventory('income', this)">По прибыли</button>
            </div>
        </div>
        <div class="inventory-grid" id="inventoryGrid">
            <!-- Сюда JS будет вставлять карточки -->
        </div>
    </div>

    <!-- Контейнер для всплывающих окон -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // --- БАЗА ПРЕДМЕТОВ (пока для теста) ---
        let inventory = [
            { id: 1, name: "Скрипт 'Червь'", type: "Скрипт", rarity: "common", income: 50 },
            { id: 2, name: "Бот-парсер", type: "Бот", rarity: "rare", income: 150 },
            { id: 3, name: "Нейросеть 'Оракул'", type: "Бот", rarity: "epic", income: 500 },
            { id: 4, name: "Абсолютный Бэкдор", type: "Бэкдор", rarity: "legendary", income: 2000 },
            { id: 5, name: "Троян-невидимка", type: "Троян", rarity: "common", income: 70 }
        ];

        let currentSort = 'rarity'; // Текущий режим сортировки по умолчанию

        // Веса для сортировки по редкости
        const rarityWeight = {
            "legendary": 4,
            "epic": 3,
            "rare": 2,
            "common": 1
        };

        // --- ФУНКЦИЯ ВСПЛЫВАЮЩИХ ОКОН (ТОСТОВ) ---
        function showToast(message, type = 'default') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            
            container.appendChild(toast);

            // Удаляем через 3 секунды
            setTimeout(() => {
                toast.classList.add('hiding');
                setTimeout(() => toast.remove(), 300); // Ждем окончания анимации
            }, 3000);
        }

        // --- РЕНДЕР ИНВЕНТАРЯ ---
        function renderInventory() {
            const grid = document.getElementById('inventoryGrid');
            grid.innerHTML = ''; // Очищаем

            // Сортируем копию массива
            let sortedInventory = [...inventory].sort((a, b) => {
                if (currentSort === 'rarity') {
                    // Сначала по редкости (убывание), потом по доходу
                    if (rarityWeight[b.rarity] !== rarityWeight[a.rarity]) {
                        return rarityWeight[b.rarity] - rarityWeight[a.rarity];
                    }
                    return b.income - a.income;
                } else if (currentSort === 'income') {
                    // По доходу (убывание)
                    return b.income - a.income;
                }
            });

            // Отрисовываем
            sortedInventory.forEach(item => {
                const card = document.createElement('div');
                card.className = `item-card ${item.rarity}`;
                card.innerHTML = `
                    <div class="item-type">${item.type}</div>
                    <div class="item-name">${item.name}</div>
                    <div class="item-income">+ ${item.income} ₽/ч</div>
                `;
                
                // Добавляем клик по карточке для показа деталей
                card.addEventListener('click', () => {
                    showToast(`Предмет: ${item.name}. Редкость: ${item.rarity.toUpperCase()}. Доход: ${item.income} ₽/ч`, item.rarity);
                });

                grid.appendChild(card);
            });
        }

        // --- СОРТИРОВКА ---
        function sortInventory(type, btn) {
            currentSort = type;
            
            // Меняем активный класс у кнопок
            document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            renderInventory();
        }

        // --- КНОПКА "ЗАБРАТЬ" ---
        const claimBtn = document.getElementById('claimBtn');
        claimBtn.addEventListener('click', () => {
            // Тут в будущем будет запрос к боту. Пока просто рандомный доход.
            const earned = Math.floor(Math.random() * 500) + 100; 
            
            // Меняем текст баланса
            const balanceDisplay = document.getElementById('balanceDisplay');
            // (Просто для визуала прибавляем к текущему)
            let currentBalance = parseInt(balanceDisplay.innerText.replace(/\s/g, '').replace('₽', ''));
            let newBalance = currentBalance + earned;
            
            // Красивое форматирование с пробелами
            balanceDisplay.innerText = newBalance.toLocaleString('ru-RU') + ' ₽';

            // Показываем красивый тост вместо alert
            showToast(`💸 Успешный взлом! Получено ${earned} ₽`);
        });

        // Инициализация при загрузке
        renderInventory();

    </script>
</body>
</html>
