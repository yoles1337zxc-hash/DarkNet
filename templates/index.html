<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>NetRunner</title>

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #050505; background-image: radial-gradient(circle at 50% 0%, #0a2a12 0%, #050505 70%); color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px 15px; min-height: 100vh; overflow-x: hidden; }
        
        .neon-text { color: #00ff41; text-shadow: 0 0 10px rgba(0, 255, 65, 0.7), 0 0 20px rgba(0, 255, 65, 0.3); }
        
        .tab-content { display: none; width: 100%; max-width: 400px; flex-direction: column; align-items: center; }
        .tab-content.active { display: flex; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .balance-card { background: linear-gradient(145deg, #121212, #0a0a0a); border: 1px solid #1a1a1a; border-radius: 16px; padding: 25px 20px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05); margin-bottom: 20px; position: relative; overflow: hidden; }
        .balance-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(0,255,65,0.05) 0%, transparent 60%); pointer-events: none; }
        
        .balance-title { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
        .balance-amount { font-size: 42px; font-weight: 900; margin-bottom: 5px; }
        .income-text { color: #b026ff; font-size: 14px; font-weight: bold; text-shadow: 0 0 8px rgba(176, 38, 255, 0.5); margin-bottom: 15px; }
        
        .progress-container { background: #000; border-radius: 10px; padding: 10px; border: 1px solid #222; margin-top: 15px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.8); }
        .progress-header { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; color: #aaa; }
        .progress-bar-bg { width: 100%; height: 12px; background: #1a1a1a; border-radius: 6px; overflow: hidden; position: relative; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #00ff41, #00bfff); border-radius: 6px; width: 0%; transition: width 0.5s ease-in-out; box-shadow: 0 0 10px #00ff41; }
        .progress-footer { font-size: 10px; color: #666; margin-top: 8px; text-align: center; }

        .btn { width: 100%; padding: 16px; background: linear-gradient(145deg, #111, #0a0a0a); border: 1px solid #333; color: #fff; font-size: 15px; font-weight: bold; border-radius: 12px; cursor: pointer; margin-bottom: 10px; transition: all 0.2s; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-transform: uppercase; letter-spacing: 1px; }
        .btn:active { transform: scale(0.96); }
        
        .btn-claim { background: linear-gradient(145deg, #003311, #001105); border-color: #00ff41; color: #00ff41; box-shadow: 0 0 15px rgba(0,255,65,0.3); font-size: 18px; padding: 20px; text-shadow: 0 0 5px rgba(0,255,65,0.5); }
        .btn-claim:active { background: #00ff41; color: #000; }
        
        .btn-daily { border-color: #00ff00; color: #00ff00; box-shadow: 0 0 10px rgba(0,255,0,0.2); }
        .btn-upgrade { border-color: #00bfff; color: #00bfff; box-shadow: 0 0 10px rgba(0,191,255,0.2); }
        .btn-luck { border-color: #ff8c00; color: #ff8c00; box-shadow: 0 0 10px rgba(255,140,0,0.2); }
        .btn-premium { border-color: #ffd700; color: #ffd700; box-shadow: 0 0 10px rgba(255,215,0,0.2); }

        .btn-case { padding: 12px 5px; font-size: 12px; border-color: #b026ff; color: #b026ff; box-shadow: 0 0 10px rgba(176,38,255,0.2); display: flex; flex-direction: column; align-items: center; line-height: 1.4; }
        .btn-case span { font-size: 10px; color: #888; margin-top: 4px; text-transform: none; letter-spacing: 0; font-weight: normal; }
        .btn-case.basic { border-color: #00ff41; color: #00ff41; box-shadow: 0 0 10px rgba(0,255,65,0.2); }
        .btn-case.advanced { border-color: #00bfff; color: #00bfff; box-shadow: 0 0 10px rgba(0,191,255,0.2); }
        .btn-case.pro { border-color: #b026ff; color: #b026ff; box-shadow: 0 0 10px rgba(176,38,255,0.2); }
        .btn-case.mythic { border-color: #ff0000; color: #ff0000; box-shadow: 0 0 10px rgba(255,0,0,0.2); }
