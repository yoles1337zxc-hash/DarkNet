<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NetRunner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #0a0a0a; color: #00ff41; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        
        .tab-content { display: none; width: 100%; max-width: 400px; flex-direction: column; align-items: center; }
        .tab-content.active { display: flex; }

        .balance-card { background: linear-gradient(180deg, #111 0%, #0a0a0a 100%); border: 1px solid #00ff41; border-radius: 12px; padding: 20px; width: 100%; text-align: center; box-shadow: 0 0 20px rgba(0, 255, 65, 0.2); margin-bottom: 20px; margin-top: 10px; }
        .balance-amount { font-size: 48px; font-weight: bold; text-shadow: 0 0 15px #00ff41; }
        .income-text { color: #b026ff; font-size: 14px; margin-top: 5px; text-shadow: 0 0 5px #b026ff; font-weight: bold; }
        
        .btn { width: 100%; padding: 16px; background: transparent; border: 2px solid #00ff41; color: #00ff41; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 0 10px #00ff41; text-transform: uppercase; margin-bottom: 12px; transition: 0.1s; position: relative; overflow: hidden;}
        .btn:active { background: #00ff41; color: #0a0a0a; transform: scale(0.98); }
        
        .btn-case { border-color: #b026ff; color: #b026ff; box-shadow: 0 0 10px #b026ff; }
        .btn-case:active { background: #b026ff; color: #0a0a0a; }
        
        .btn-upgrade { border-color: #00bfff; color: #00bfff; box-shadow: 0 0 10px #00bfff; }
        .btn-upgrade:active { background: #00bfff; color: #0a0a0a; }
        
        .btn-luck { border-color: #ff8c00; color: #ff8c00; box-shadow: 0 0 10px #ff8c00; }
        .btn-luck:active { background: #ff8c00; color: #0a0a0a; }
        
        .btn-premium { border-color: #ffd700; color: #ffd700; box-shadow: 0 0 10px #ffd700; }
        .btn-premium:active { background: #ffd700; color: #0a0a0a; }

        .btn-daily { border-color: #00ff00; color: #00ff00; box-shadow: 0 0 10px #00ff00; }
        .btn-daily:active { background: #00ff00; color: #0a0a0a; }

        .inventory-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; margin-top: 10px; padding-bottom: 80px; }
        .item-card { background: #111; border: 1px solid #333; padding: 12px; border-radius: 10px; text-align: center; cursor: pointer; transition: 0.2s; position: relative; }
        .item-card:active { transform: scale(0.95); }
        .item-icon { font-size: 32px; margin-bottom: 5px; filter: drop-shadow(0 0 5px currentColor); }
        .item-type { font-size: 10px; color: #888; text-transform: uppercase; margin-bottom: 3px; }
        .item-name { font-size: 11px; color: #fff; margin-bottom: 5px; font-weight: bold; line-height: 1.2; }
        .item-income { font-size: 12px; color: #00ff41; font-weight: bold; }
        
        .rarity-Обычный { border-color: #888; box-shadow: 0 0 5px #888; color: #888; }
        .rarity-Редкий { border-color: #00bfff; box-shadow: 0 0 8px #00bfff; color: #00bfff;}
        .rarity-Эпический { border-color: #b026ff; box-shadow: 0 0 12px #b026ff; color: #b026ff;}
        .rarity-Легендарный { border-color: #ffd700; box-shadow: 0 0 15px #ffd700; color: #ffd700;}
        .rarity-Мифический { border-color: #ff0000; box-shadow: 0 0 20px #ff0000; color: #ff0000;}

        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #111; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #333; z-index: 100; }
        .nav-btn { background: none; border: none; color: #888; font-size: 24px; cursor: pointer; transition: 0.2s; }
        .nav-btn.active { color: #00ff41; text-shadow: 0 0 10px #00ff41; transform: scale(1.2); }
        
        .craft-box { background: #111; border: 1px solid #333; padding: 15px; border-radius: 10px; width: 100%; margin-bottom: 15px; box-shadow: 0 0 10px rgba(255,0,255,0.1); }
        .craft-title { color: #fff; margin-bottom: 10px; font-size: 13px; text-align: center; }
        .btn-craft { border-color: #ff00ff; color: #ff00ff; box-shadow: 0 0 10px #ff00ff; font-size: 14px; padding: 10px; margin-bottom: 0;}
        .btn-craft:active { background: #ff00ff; color: #0a0a0a; }
    </style>
</head>
<body>
    <div id="tab-main" class="tab-content active">
        <div class="balance-card">
            <div>БАЛАНС</div>
            <div class="balance-amount" id="balance">0 ₽</div>
            <div class="income-text" id="income">Доход: 0 ₽/ч</div>
        </div>
        
        <button class="btn" id="claimBtn">Взломать и забрать</button>
        <button class="btn btn-daily" id="dailyBtn">Ежедневный бонус</button>
        <button class="btn btn-upgrade" id="upgradeBtn">Улучшить сервер</button>
        <button class="btn btn-luck" id="luckBtn">Удача (Ур. 1)</button>
        <button class="btn btn-case" id="caseBtn">Купить деталь (50 ₽)</button>
        <button class="btn btn-premium" id="premiumBtn">Премиум-деталь (15 ⭐️)</button>
    </div>

    <div id="tab-inventory" class="tab-content">
        <h2 style="margin-top: 20px; margin-bottom: 5px;">СТОЙКА СЕРВЕРА</h2>
        <p style="font-size: 10px; color: #888; margin-bottom: 15px;">Нажми на деталь, чтобы продать её</p>
        <div class="inventory-grid" id="inventoryGrid"></div>
    </div>

    <div id="tab-craft" class="tab-content">
        <h2 style="margin-top: 20px; margin-bottom: 10px;">МАСТЕРСКАЯ</h2>
        <p style="font-size: 11px; color: #888; text-align: center; margin-bottom: 15px;">Соберите 3 одинаковые детали одного типа, чтобы попытаться повысить их редкость. При неудаче детали сгорают!</p>
        <div id="craftList" style="width: 100%;"></div>
    </div>

    <div id="tab-leaderboard" class="tab-content">
        <h2 style="margin-top: 20px; margin-bottom: 20px; color: #ffd700; text-shadow: 0 0 10px #ffd700;">ТОП ХАКЕРОВ</h2>
        <div id="leaderboardList" style="width: 100%; padding-bottom: 80px;"></div>
    </div>

    <div class="nav-bar">
        <button class="nav-btn active" onclick="switchTab('main', this)">💻</button>
        <button class="nav-btn" onclick="switchTab('inventory', this)">⚙️</button>
        <button class="nav-btn" onclick="switchTab('craft', this)">🔧</button>
        <button class="nav-btn" onclick="switchTab('leaderboard', this)">🏆</button>
    </div>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand(); 
        
        const userId = Telegram.WebApp.initDataUnsafe.user.id;
        const tgUser = Telegram.WebApp.initDataUnsafe.user;
        const userName = tgUser.username || tgUser.first_name || 'Хакер';

        const icons = {
            "Процессор": "🔲", "Видеокарта": "🎮", "Плата": "🧩", "Охлаждение": "❄️", "Питание": "🔋", "Корпус": "📦"
        };

        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            btnElement.classList.add('active');
            if(tabName === 'inventory') loadInventory();
            if(tabName === 'craft') loadCraftable();
            if(tabName === 'leaderboard') loadLeaderboard();
        }

        function updateUI(balance, income, upgradeCost, luckLevel, luckCost) {
            document.getElementById('balance').innerText = balance + " ₽";
            document.getElementById('income').innerText = "Доход: " + income + " ₽/ч";
            document.getElementById('upgradeBtn').innerText = `Улучшить сервер (${upgradeCost} ₽)`;
            document.getElementById('luckBtn').innerText = `Удача (Ур. ${luckLevel}) - ${luckCost} ₽`;
        }

        function loadData() {
            fetch('/api/get_data', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user_id: userId, username: userName }) })
            .then(res => res.json()).then(data => updateUI(data.balance, data.income, data.upgrade_cost, data.luck_level, data.luck_cost));
        }
        loadData();

        function loadInventory() {
            fetch('/api/get_inventory', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user_id: userId }) })
            .then(res => res.json()).then(data => {
                const grid = document.getElementById('inventoryGrid');
                grid.innerHTML = ''; 
                if (data.inventory.length === 0) { grid.innerHTML = '<div style="grid-column: span 2; text-align:center; color:#888;">Стойка пуста. Покупай детали!</div>'; return; }
                data.inventory.forEach(item => {
                    const div = document.createElement('div');
                    div.className = `item-card rarity-${item.rarity}`;
                    div.onclick = () => sellItem(item.id, item.name);
                    const icon = icons[item.type] || "⚙️";
                    div.innerHTML = `<div class="item-icon">${icon}</div><div class="item-type">${item.type}</div><div class="item-name">${item.name}</div><div class="item-income">+${item.income} ₽/ч</div>`;
                    grid.appendChild(div);
                });
            });
        }

        function sellItem(itemId, itemName) {
            Telegram.WebApp.showConfirm(`Вы уверены, что хотите продать "${itemName}"?`, (confirmed) => {
                if (confirmed) {
                    fetch('/api/sell', { method: 'POST', headers: { 'Content-Type': 'application
