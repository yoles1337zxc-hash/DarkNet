<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetRunner Terminal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Сброс стилей */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #0a0a0a;
            color: #00ff41;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            padding-bottom: 100px; /* Чтобы уведомления не перекрывали контент */
        }

        /* --- Шапка --- */
        .header {
            width: 100%;
            max-width: 400px;
            text-align: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 12px;
            color: #888;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .balance {
            font-size: 44px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff41, 0 0 20px #00ff41;
            margin-bottom: 5px;
        }

        .income {
            font-size: 16px;
            color: #b026ff;
            text-shadow: 0 0 5px #b026ff;
        }

        /* --- Главная кнопка --- */
        .main-btn {
            width: 100%;
            max-width: 400px;
            padding: 15px;
            background: transparent;
            border: 2px solid #00ff41;
            color: #00ff41;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 10px #00ff41, inset 0 0 10px #00ff41;
            transition: all 0.2s;
            margin-bottom: 30px;
        }

        .main-btn:active {
            background: #00ff41;
            color: #0a0a0a;
            box-shadow: 0 0 30px #00ff41;
        }

        /* --- Инвентарь --- */
        .inventory-section {
            width: 100%;
            max-width: 400px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .section-title {
            font-size: 16px;
            color: #888;
            text-transform: uppercase;
        }

        /* Кнопки сортировки */
        .sort-controls {
            display: flex;
            gap: 8px;
        }

        .sort-btn {
            background: #111;
            border: 1px solid #333;
            color: #888;
            font-size: 10px;
            padding: 6px 10px;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .sort-btn.active {
            border-color: #00ff41;
            color: #00ff41;
            box-shadow: 0 0 5px #00ff41;
        }

        /* Сетка предметов */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        /* Карточка */
        .item-card {
            background: #111;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            transition: transform 0.1s;
        }
        
        .item-card:active {
            transform: scale(0.97);
        }

        /* Рамки редкостей */
        .item-card.common { border-color: #555; }
        .item-card.rare { border-color: #00bfff; box-shadow: inset 0 0 10px rgba(0, 191, 255, 0.2); }
        .item-card.epic { border-color: #b026ff; box-shadow: inset 0 0 10px rgba(176, 38, 255, 0.2); }
        .item-card.legendary { border-color: #ffd700; box-shadow: inset 0 0 15px rgba(255, 215, 0, 0.3); }

        .item-type {
            font-size: 9px;
            color: #555;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .item-name {
            font-size: 13px;
            margin-bottom: 8px;
            color: #fff;
            font-weight: bold;
        }

        .item-income {
            font-size: 12px;
            color: #00ff41;
            font-weight: bold;
        }

        /* --- Всплывающие окна (Тосты) --- */
        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
            width: 90%;
            max-width: 350px;
            pointer-events: none; /* Чтобы не блокировали клики */
        }

        .toast {
            background: #111;
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.4);
            animation: slideUp 0.3s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        /* Цвета уведомлений */
        .toast.rare { border-color: #00bfff; color: #00bfff; box-shadow: 0 0 15px rgba(0, 191, 255, 0.4); }
        .toast.epic { border-color: #b026ff; color: #b026ff; box-shadow: 0 0 15px rgba(176, 38, 255, 0.4); }
        .toast.legendary { border-color: #ffd700; color: #ffd700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }
        .toast.error { border-color: #ff3333; color: #ff3333; box-shadow: 0 0 15px rgba(255, 51, 51, 0.4); }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }
        
        .toast.hiding {
            animation: fadeOut 0.3s ease-in forwards;
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(10px); }
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="header">
        <div class="title">NETRUNNER TERMINAL</div>
        <div class="balance" id="balanceDisplay">0 ₽</div>
        <div class="income" id="incomeDisplay">+ 0 ₽/ч</div>
    </div>

    <!-- Главная кнопка -->
    <button class="main-btn" id="claimBtn">Взломать и забрать</button>

    <!-- Инвентарь -->
    <div class="inventory-section">
        <div class="section-header">
            <div class="section-title">АРСЕНАЛ</div>
            <div class="sort-controls">
                <button class="sort-btn active" id="btnRarity">Редкость</button>
                <button class="sort-btn" id="btnIncome">Прибыль</button>
            </div>
        </div>
        <div class="inventory-grid" id="inventoryGrid"></div>
    </div>

    <!-- Контейнер для уведомлений -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // --- ДАННЫЕ ---
        let balance = 1500;
        
        let inventory = [
            { id: 1, name: "Скрипт 'Червь'", type: "Скрипт", rarity: "common", income: 50 },
            { id: 2, name: "Бот-парсер", type: "Бот", rarity: "rare", income: 150 },
            { id: 3, name: "Нейросеть 'Оракул'", type: "Бот", rarity: "epic", income: 500 },
            { id: 4, name: "Абсолютный Бэкдор", type: "Бэкдор", rarity: "legendary", income: 2000 },
            { id: 5, name: "Троян-невидимка", type: "Троян", rarity: "common", income: 70 }
        ];

        let currentSort = 'rarity'; 
        const rarityWeight = { "legendary": 4, "epic": 3, "rare": 2, "common": 1 };

        // --- ФУНКЦИЯ УВЕДОМЛЕНИЙ ---
        function showToast(message, rarity = 'common') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            // Если редкость не передана (например, для денег), используем базовый стиль
            toast.className = `toast ${rarity}`;
            toast.innerText = message;
            
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('hiding');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // --- ОБНОВЛЕНИЕ ЭКРАНА ---
        function updateUI() {
            // Считаем общий доход
            let totalIncome = inventory.reduce((sum, item) => sum + item.income, 0);
            
            // Выводим баланс и доход
            document.getElementById('balanceDisplay').innerText = balance.toLocaleString('ru-RU') + ' ₽';
            document.getElementById('incomeDisplay').innerText = '+ ' + totalIncome.toLocaleString('ru-RU') + ' ₽/ч';

            // Рендерим инвентарь
            const grid = document.getElementById('inventoryGrid');
            grid.innerHTML = ''; 

            // Сортировка
            let sortedInv = [...inventory].sort((a, b) => {
                if (currentSort === 'rarity') {
                    if (rarityWeight[b.rarity] !== rarityWeight[a.rarity]) {
                        return rarityWeight[b.rarity] - rarityWeight[a.rarity];
                    }
                    return b.income - a.income;
                } else {
                    return b.income - a.income;
                }
            });

            // Отрисовка карточек
            sortedInv.forEach(item => {
                const card = document.createElement('div');
                card.className = `item-card ${item.rarity}`;
                card.innerHTML = `
                    <div class="item-type">${item.type}</div>
                    <div class="item-name">${item.name}</div>
                    <div class="item-income">+ ${item.income} ₽/ч</div>
                `;
                
                // Детали при клике
                card.addEventListener('click', () => {
                    const rarityRu = { common: "Обычный", rare: "Редкий", epic: "Эпический", legendary: "Легендарный" };
                    showToast(`${item.name}\nРедкость: ${rarityRu[item.rarity]}\nДоход: +${item.income} ₽/ч`, item.rarity);
                });

                grid.appendChild(card);
            });
        }

        // --- КНОПКИ СОРТИРОВКИ ---
        document.getElementById('btnRarity').addEventListener('click', function() {
            currentSort = 'rarity';
            document.getElementById('btnRarity').classList.add('active');
            document.getElementById('btnIncome').classList.remove('active');
            updateUI();
        });

        document.getElementById('btnIncome').addEventListener('click', function() {
            currentSort = 'income';
            document.getElementById('btnIncome').classList.add('active');
            document.getElementById('btnRarity').classList.remove('active');
            updateUI();
        });

        // --- КНОПКА "ЗАБРАТЬ" ---
        document.getElementById('claimBtn').addEventListener('click', () => {
            // Считаем, сколько заработали (для теста - рандом от 100 до 500)
            const earned = Math.floor(Math.random() * 400) + 100; 
            balance += earned;
            
            // Обновляем экран
            updateUI();
            
            // Показываем уведомление
            showToast(`💸 Взлом успешен! + ${earned} ₽`);
        });

        // Запуск при загрузке
        updateUI();

    </script>
</body>
</html>
